services:
  bot:
    build:
      context: .
      args:
        # 1 — поставить локальное распознавание речи (нужно для WHISPER_MODEL)
        WITH_WHISPER: "0"
    env_file: .env
    environment:
      DB_PATH: /app/data/bot.sqlite3
    volumes:
      - ./data:/app/data
    restart: unless-stopped
